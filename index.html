<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поліграфія</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="/">Відбиток</a>
        <button class="menu-button" aria-label="Відкрити меню" type="button">
          ☰
        </button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <p class="hero-label">Поліграфія у Києві</p>
          <h1 class="hero-title">Друк для ваших ідей</h1>
          <p class="hero-description">
            Візитки, листівки й плакати для вашого бізнесу.
          </p>
          <a class="hero-cta" href="#order">Замовити друк</a>
          <img
            src="./img/hero.png"
            class="hero-image"
            alt="Синя брошура «Відбиток», помаранчеві візитки та плакат із чорно-білим портретом"
          />
        </div>
      </section>
      <section class="services">
        <div class="container">
          <h2>Послуги</h2>
          <ul class="services-list">
            <li>Візитки</li>
            <li>Листівки</li>
            <li>Плакати</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
