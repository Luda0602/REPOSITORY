<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поліграфія</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="logo" href="/">Відбиток</a>
        <nav class="header-nav" aria-label="Основна навігація">
          <a href="#services">Послуги</a>
          <a href="#order">Замовити друк</a>
        </nav>
        <button class="menu-button" aria-label="Відкрити меню" type="button">
          ☰
        </button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container hero-inner">
          <div class="hero-content">
            <p class="hero-label">Поліграфія у Києві</p>
            <h1 class="hero-title">Друк для ваших ідей</h1>
            <p class="hero-description">
              Візитки, листівки й плакати для вашого бізнесу.
            </p>
            <a class="hero-cta" href="#order">Замовити друк</a>
          </div>
          <img
            src="./img/hero.png"
            class="hero-image"
            alt="Синя брошура «Відбиток», помаранчеві візитки та плакат із чорно-білим портретом"
          />
        </div>
      </section>
      <section class="services" id="services">
        <div class="container">
          <h2>Послуги</h2>
          <ul class="services-list">
            <li>
              <span>Візитки</span>
              <span aria-hidden="true">→</span>
            </li>
            <li>
              <span>Листівки</span>
              <span aria-hidden="true">→</span>
            </li>
            <li>
              <span>Плакати</span>
              <span aria-hidden="true">→</span>
            </li>
          </ul>
        </div>
      </section>
      <section class="order" id="order">
        <div class="container">
          <h2>Замовити друк</h2>
          <form class="order-form">
            <div class="form-field">
              <label for="customer-name">Ваше ім’я</label>

              <input
                type="text"
                id="customer-name"
                name="customerName"
                autocomplete="name"
                required
              />
            </div>
            <div class="form-field">
              <label for="customer-phone">Телефон</label>
              <input
                type="tel"
                id="customer-phone"
                name="phone"
                autocomplete="tel"
                required
              />
            </div>
            <div class="form-field form-field-wide">
              <label for="order-details">Що потрібно надрукувати?</label>
              <textarea id="order-details" name="details" rows="4"></textarea>
            </div>
            <button type="submit" class="order-submit">Надіслати заявку</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <p>© 2026 Відбиток</p>
      </div>
    </footer>
  </body>
</html>
